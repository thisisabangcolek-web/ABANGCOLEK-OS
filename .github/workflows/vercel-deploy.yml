name: Auto Deploy to Vercel Production (vprod)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Verify Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://bktksvhcgszaoqkdyhil.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_w7MhqJ0ruVjh40a-QWGjgA_aUw3hAe3' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || 'AIzaSyCleOGxdOFU__Zb6hsO57jeQytdvxoh0wA' }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN || 'vcp_8SbIn7ENW44RwyDQXAQMXLrcnXkaRnf5VYjW8QhzFclSeO1jgf3PJoRT' }}
          vercel-args: '--prod --yes'
          vercel-project-name: 'abangcolek-os'
          working-directory: ./
